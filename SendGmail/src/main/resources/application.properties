spring.application.name=SendGmail

spring.datasource.url=jdbc:mysql://localhost:3306/bulk_email?connectionTimeZone=UTC
spring.datasource.username=bulk_email_app
spring.datasource.password=${DB_PASSWORD}

# Local development SMTP server
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.default-encoding=UTF-8

# Local test server does not require authentication or TLS
spring.mail.properties[mail.smtp.auth]=false
spring.mail.properties[mail.smtp.starttls.enable]=false
spring.mail.properties[mail.smtp.ssl.enable]=false

# Timeouts in milliseconds
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

app.mail.from=no-reply@example.test

# Database connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Use UTC for each database connection's session
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# Database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Let Flyway manage schema initialization
spring.sql.init.mode=never