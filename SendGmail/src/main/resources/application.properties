spring.application.name=SendGmail

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/bulk_email?connectionTimeZone=UTC&useAffectedRows=true
spring.datasource.username=bulk_email_app
spring.datasource.password=${DB_PASSWORD}

# Database connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Use UTC for each database session
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# Local Mailpit SMTP
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# Local Mailpit does not require authentication or TLS
spring.mail.properties[mail.smtp.auth]=false
spring.mail.properties[mail.smtp.starttls.enable]=false
spring.mail.properties[mail.smtp.starttls.required]=false
spring.mail.properties[mail.smtp.ssl.enable]=false

# SMTP timeouts in milliseconds
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=10000
spring.mail.properties[mail.smtp.writetimeout]=10000

# Sender address: shared by existing and campaign email services
app.mail.from=no-reply@example.com
app.email.from=${app.mail.from}

# CSV upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
spring.servlet.multipart.file-size-threshold=0

# Store uploaded files outside the project
app.import.storage-directory=${user.home}/bulk-email/uploads

# CSV import worker
app.import.worker.enabled=true
app.import.worker.poll-delay-ms=5000
app.import.worker.lease-seconds=300

# Email sending worker
app.email.worker.enabled=true
app.email.worker.poll-delay-ms=100
app.email.worker.lease-seconds=300
app.email.worker.max-attempts=3
app.email.worker.retry-delay-seconds=30