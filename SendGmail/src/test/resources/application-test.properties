# Separate test database
spring.datasource.url=jdbc:mysql://localhost:3306/bulkemailtest?connectionTimeZone=UTC&useAffectedRows=true
spring.datasource.username=bulk_email_test_user
spring.datasource.password=${TEST_DB_PASSWORD}

# Small connection pool for tests
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# Apply the actual project migrations to the test database
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.sql.init.mode=never

# Background workers must stay disabled during tests
app.import.worker.enabled=false
app.email.worker.enabled=false

# Separate upload directory for tests
app.import.storage-directory=${java.io.tmpdir}/bulk-email-test/uploads

# Sender configuration required for application context creation
app.mail.from=no-reply@example.com
app.email.from=${app.mail.from}

# No SMTP connectivity check during startup
spring.mail.test-connection=false